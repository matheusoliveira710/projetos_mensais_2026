<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Finanças Pessoais</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1 class="h1">Controle de Finanças Pessoais!</h1>
    </header>
    <main>
        <section>
            <h2>Movimentações Financeiras</h2>
            <form id="form-movimentacao">
                <label for="tipo">Tipo de movimentação:</label><br>
                <select id="tipo">
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>
                <label for="descricao">
                    Descrição:
                </label>
                <input type="text" placeholder="Digite a descrição..." id="descricao">
                <br><br>
                <label for="valor">
                    Valor:
                </label>
                <input type="number" step="0.01" placeholder="Digite o valor..." id="valor">
                <br><br>
                <label for="categoria">
                    Categoria:
                </label>
                <select id="categoria">
                    <option value="alimentacao">Alimentação</option>
                    <option value="transporte">Transporte</option>
                    <option value="moradia">Moradia</option>
                    <option value="lazer">Lazer</option>
                </select>
                <br><br>
                <label for="forma_pagamento">
                    Forma de Pagamento:
                </label>
                <select id="forma_pagamento">
                    <option value="dinheiro">Dinheiro</option>
                    <option value="cartao_credito">Cartão de Crédito</option>
                    <option value="cartao_debito">Cartão de Débito</option>
                </select>
                <br><br>
                <label for="data">
                    Data:
                </label>
                <input type="date" id="data">
                <br><br>
                <input type="submit" value="Adicionar"><br>
            </form>
        </section>
        <section>
            <h2>Histórico de Movimentações</h2>
            <table>
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Categoria</th>
                        <th>Forma de Pagamento</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="historico-movimentacoes">
                    <!-- As movimentações serão adicionadas aqui via JavaScript -->
                </tbody>
            </table>
        </section>
        <section>
            <h2>Resumo Financeiro</h2>
            <p>Saldo Atual: <span id="saldo-atual">R$ 0,00</span></p>
            <p class="p1">Total de Receitas: <span id="total-receitas">R$ 0,00</span></p>
            <p class="p2">Total de Despesas: <span id="total-despesas">R$ 0,00</span></p>
        </section>
    </main>
    <script src="./script/script.js"></script>
</body>
</html>
