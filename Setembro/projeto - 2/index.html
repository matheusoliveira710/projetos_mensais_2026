<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto - 02 - Setembro</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1 class="h1">Controlador de Finanças Pessoais!</h1>
        <p>Adicione aqui suas despesas e receitas!</p>
    </header>
    <main>
        <section>
            <h2>Movimentações Financeiras</h2>
            <form>
                <label for="tipo">Tipo de movimentação:</label><br>
                <label for="descricao">
                    Descrição:
                </label>
                <select id="tipo">
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>
                <input type="text" placeholder="Digite a descrição..." id="descricao">
                <br><br>
                <label for="valor">
                    Valor:
                </label>
                <input type="number" step="0.01" placeholder="Digite o valor..." id="valor">
                <br><br>
                <label for="categoria">
                    Categoria:
                </label>
                <select id="categoria">
                    <option value="alimentacao">Alimentação</option>
                    <option value="transporte">Transporte</option>
                    <option value="moradia">Moradia</option>
                    <option value="lazer">Lazer</option>
                </select>
                <br><br>
                <label for="forma_pagamento">
                    Forma de Pagamento:
                </label>
                <select id="forma_pagamento">
                    <option value="dinheiro">Dinheiro</option>
                    <option value="cartao_credito">Cartão de Crédito</option>
                    <option value="cartao_debito">Cartão de Débito</option>
                </select>
                <br><br>
                <label for="data">
                    Data:
                </label>
                <input type="date" id="data">
                <br><br>
                <input type="submit" value="Adicionar"><br>
            </form>
        </section>
    </main>
    <script src="./script/script.js"></script>
</body>
</html>
