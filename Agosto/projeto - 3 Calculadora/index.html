<!-- Criar uma aplicação interativa onde o usuário pode adicionar novas tarefas, apagar e editar tarefas. -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto - Calculadora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Calculadora</h1>
    <h2>Desenvolvida em HTML, CSS e JavaScript</h2>
    <main>
        <div class="calculadora">
            <input
                id="visor"
                type="text"
                class="visor"
                placeholder="0"
                readonly
            >
        <div class="botoes">
            <button class="limpar">C</button>
            <button class="apagar">⌫</button>
            <button class="operador">%</button>
            <button class="operador">/</button>
            <button class="numero">7</button>
            <button class="numero">8</button>
            <button class="numero">9</button>
            <button class="operador">*</button>
            <button class="numero">4</button>
            <button class="numero">5</button>
            <button class="numero">6</button>
            <button class="operador">-</button>
            <button class="numero">1</button>
            <button class="numero">2</button>
            <button class="numero">3</button>
            <button class="operador">+</button>
            <button class="numero">0</button>
            <button class="numero">.</button>
            <button class="igual">=</button>
        </div>
        </div>
        <p>

        </p>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
